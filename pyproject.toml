[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intento-runtime"
version = "1.1.0"
description = "INTENTO Runtime: human-readable code, controlled syntax, real execution."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Alessandro Bertelli" }
]
keywords = ["programming-language", "runtime", "human-readable", "safe-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
intento = "intento_runtime.cli:main"

[tool.setuptools]
packages = ["intento_runtime"]
